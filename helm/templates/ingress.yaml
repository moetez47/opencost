{{- if .Values.ingress.enabled }}
# Ingress #1: /model — needs prefix stripped (OpenCost expects paths without /model)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enclaive-ingress-model
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /model(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.opencost.service.name }}
                port:
                  number: {{ .Values.opencost.service.port }}
---
# Ingress #2: /api and / — no rewrite, backend routes already include /api prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enclaive-ingress-main
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
